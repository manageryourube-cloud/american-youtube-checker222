<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чекер монетизации YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06285f;--bg2:#041c45;--blue:#0b46a0;--red:#ff0a0a;--ok:#2ee86f;--warn:#ffc531;--bad:#ff4d4d}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 30% 20%,var(--bg),var(--bg2));color:#fff;
font-family:'Montserrat',Impact,Arial,sans-serif;overflow-x:hidden;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 60px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;min-height:100vh}
h1{font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-1px}
h1 .w{display:block;font-size:clamp(54px,9vw,110px);text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 .r{display:block;color:var(--red);font-size:clamp(36px,6.4vw,78px);margin-top:6px}
.sub{margin:18px 0 22px;color:#b9cdf5;font-weight:600;max-width:520px}
.box{display:flex;gap:10px;flex-wrap:wrap;max-width:560px}
input{flex:1 1 260px;padding:16px 18px;border-radius:14px;border:2px solid #2a64c8;background:#041b44;color:#fff;font:600 16px Montserrat,Arial}
input::placeholder{color:#6e8fcf}
button.go{padding:16px 26px;border:0;border-radius:14px;background:var(--red);color:#fff;font:900 16px Montserrat,Arial;cursor:pointer;text-transform:uppercase}
button.go:disabled{opacity:.6;cursor:wait}
.tg{display:inline-flex;gap:8px;align-items:center;margin-top:22px;color:#fff;text-decoration:none;background:#1c6fe0;padding:11px 18px;border-radius:12px;font-weight:700}
.tg:hover{background:#2a82ff}
.art{position:relative;aspect-ratio:1;max-width:470px;width:100%;justify-self:center}
.circle{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#0f52b8,var(--blue));opacity:.85}
.yt{position:absolute;left:8%;top:32%;width:84%;height:36%;background:var(--red);border-radius:26% / 36%;display:grid;place-items:center}
.yt:after{content:"";border-left:56px solid #fff;border-top:34px solid transparent;border-bottom:34px solid transparent;margin-left:12px}
.flag{position:absolute;right:2%;bottom:20%;width:34%;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.q{position:absolute;font-weight:900;color:#1a5bc4;font-size:90px;line-height:1}
.q1{right:-4%;top:-6%;transform:rotate(12deg)}.q2{right:-10%;bottom:-6%;font-size:70px}
.dots{position:absolute;width:100px;height:70px;background-image:radial-gradient(#1f63d6 3px,transparent 3.5px);background-size:17px 17px}
.d1{left:6%;top:12%}.d2{right:12%;bottom:0}
#res{grid-column:1/-1;max-width:760px;justify-self:start;width:100%}
.card{background:rgba(3,20,55,.8);border:2px solid #2a64c8;border-radius:20px;padding:24px;backdrop-filter:blur(4px)}
.status{font-size:clamp(24px,4vw,36px);font-weight:900;text-transform:uppercase}
.yes{color:var(--ok)}.maybe{color:var(--warn)}.no{color:var(--bad)}.unknown{color:#aab}
.meta{color:#b9cdf5;margin:6px 0 14px;font-weight:600}
.card ul{padding-left:20px;line-height:1.7;color:#dbe6ff;font-weight:600}
.note{margin-top:14px;font-size:13px;color:#8fa9dd;font-weight:600;line-height:1.5}
.err{color:#ffb3b3;font-weight:700}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.art{max-width:340px;order:-1}}
</style>
</head>
<body>
<div class="dots d1" style="position:absolute"></div>
<main class="wrap">
  <section>
    <h1><span class="w">Чекер</span><span class="r">монетизации</span></h1>
    <p class="sub">Вставьте ссылку на YouTube-канал, @handle или ID — проверим, включена ли монетизация.</p>
    <div class="box">
      <input id="q" placeholder="https://youtube.com/@channel" autocomplete="off">
      <button class="go" id="btn">Проверить</button>
    </div>
    <a class="tg" href="https://t.me/americanyoutuber" target="_blank" rel="noopener">✈ Автор: Telegram-канал @americanyoutuber</a>
  </section>
  <div class="art">
    <div class="circle"></div><div class="yt"></div>
    <svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#fff"/>
      <g fill="#d22">
        <rect y="0" width="60" height="3.1"/><rect y="6.2" width="60" height="3.1"/><rect y="12.4" width="60" height="3.1"/>
        <rect y="18.5" width="60" height="3.1"/><rect y="24.6" width="60" height="3.1"/><rect y="30.8" width="60" height="3.1"/><rect y="36.9" width="60" height="3.1"/></g>
      <rect width="26" height="21.5" fill="#1b3a8a"/>
      <g fill="#fff"><circle cx="4" cy="4" r="1"/><circle cx="10" cy="4" r="1"/><circle cx="16" cy="4" r="1"/><circle cx="22" cy="4" r="1"/>
      <circle cx="7" cy="9" r="1"/><circle cx="13" cy="9" r="1"/><circle cx="19" cy="9" r="1"/>
      <circle cx="4" cy="14" r="1"/><circle cx="10" cy="14" r="1"/><circle cx="16" cy="14" r="1"/><circle cx="22" cy="14" r="1"/>
      <circle cx="7" cy="18.5" r="1"/><circle cx="13" cy="18.5" r="1"/><circle cx="19" cy="18.5" r="1"/></g></svg>
    <span class="q q1">?</span><span class="q q2">?</span><div class="dots d2"></div>
  </div>
  <section id="res"></section>
</main>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function run(){
  const q=$('q').value.trim(); if(!q) return;
  $('btn').disabled=true; $('btn').textContent='Проверяю…';
  $('res').innerHTML='<div class="card">Анализирую канал и последние видео, это занимает 5–15 секунд…</div>';
  try{
    const r=await fetch('/api/check?q='+encodeURIComponent(q)); const d=await r.json();
    if(d.error){ $('res').innerHTML='<div class="card err">'+esc(d.error)+'</div>'; return; }
    $('res').innerHTML=`<div class="card">
      <div class="status ${d.status}">${esc(d.verdict)}</div>
      <div class="meta">${esc(d.title)}${d.subs?' · '+esc(d.subs)+' подписчиков':''} · точность: ${esc(d.confidence)}</div>
      <ul>${d.signals.map(s=>'<li>'+esc(s)+'</li>').join('')}</ul>
      <div class="note">Результат основан на внешних признаках: показ рекламы на видео и доступность платных подписок. Статус партнёрской программы видит только владелец в YouTube Studio. Версия чекера: ${esc(d.version||'устарела')}</div>
    </div>`;
  }catch(e){ $('res').innerHTML='<div class="card err">Сервер недоступен. Запущен ли server.py?</div>'; }
  finally{ $('btn').disabled=false; $('btn').textContent='Проверить'; }
}
$('btn').onclick=run; $('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script>
</body>
</html>
